services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: getsocs_db
      MYSQL_USER: ${DB_USER:-getsocs}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in server/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in server/.env}
    volumes:
      - getsocs_mysql:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--protected-mode", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file:
      - server/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: getsocs_db
      DB_USER: ${DB_USER:-getsocs}
      DB_PASS: ${DB_PASS}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - getsocs_uploads:/app/server/uploads
      - getsocs_private_uploads:/app/server/private_uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  getsocs_mysql:
  getsocs_uploads:
  getsocs_private_uploads:
